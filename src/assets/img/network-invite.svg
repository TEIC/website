<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 880" role="img">
  <title>Wanted by the network: top-tier encoders - join the TEI</title>
  <defs>
    <linearGradient id="frameBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3558"/>
      <stop offset="1" stop-color="#0B1F3A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frameClip"><rect x="170" y="150" width="300" height="270" rx="18"/></clipPath>
  </defs>

  <rect width="640" height="880" fill="#ffffff"/>

  <!-- header -->
  <rect width="640" height="122" fill="#0B1F3A"/>
  <rect y="122" width="640" height="5" fill="#F7A823"/>
  <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" fill="#fff" text-anchor="middle">
    <text x="320" y="52" font-size="22" letter-spacing="2" textLength="520" lengthAdjust="spacingAndGlyphs">WANTED BY THE NETWORK:</text>
    <text x="320" y="100" font-size="42" textLength="540" lengthAdjust="spacingAndGlyphs">TOP-TIER ENCODERS</text>
  </g>

  <!-- empty frame -->
  <rect x="170" y="150" width="300" height="270" rx="18" fill="url(#frameBg)"/>
  <g clip-path="url(#frameClip)">
    <!-- silhouette -->
    <g fill="none" stroke="#5f7ea6" stroke-width="3" stroke-dasharray="8 6" opacity="0.7">
      <circle cx="320" cy="248" r="48"/>
      <path d="M212 420 C214 340 262 316 320 316 C378 316 426 340 428 420"/>
    </g>
    <!-- sheen -->
    <polygon points="190,150 250,150 160,420 100,420" fill="url(#sheen)" transform="translate(70 0)"/>
    <polygon points="300,150 320,150 230,420 210,420" fill="url(#sheen)" opacity="0.7" transform="translate(130 0)"/>
  </g>
  <rect x="170" y="150" width="300" height="270" rx="18" fill="none" stroke="#0B1F3A" stroke-width="4"/>
  <g text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" fill="#fff">
    <text x="320" y="262" font-size="25" textLength="256" lengthAdjust="spacingAndGlyphs">IMAGE NOT FOUND:</text>
    <text x="320" y="302" font-size="34" fill="#F7A823">IS IT YOU?</text>
  </g>
  <text x="320" y="338" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#9fb4d1">404 &lt;graphic url="you.jpg"/&gt;</text>

  <!-- data block -->
  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <text x="30" y="458" font-size="13" font-weight="900" fill="#0B1F3A" letter-spacing="2.5">IDENTIFIED AS</text>
      <text x="30" y="480" font-size="14.5" fill="#333">Forward-thinking scholars, markup disruptors and collaborative minds</text>
      <text x="30" y="499" font-size="14.5" fill="#333">who answer every encoding question with "it depends".</text>
      <line x1="30" y1="518" x2="610" y2="518" stroke="#cfd6e0"/>
    </g>
    <g>
      <text x="30" y="546" font-size="13" font-weight="900" fill="#0B1F3A" letter-spacing="2.5">LAST KNOWN LOCATION</text>
      <text x="30" y="568" font-size="14.5" fill="#333">Stuck in uninspired spreadsheets and proprietary word-processor</text>
      <text x="30" y="587" font-size="14.5" fill="#333">formats, far from any well-formed document.</text>
      <line x1="30" y1="606" x2="610" y2="606" stroke="#cfd6e0"/>
    </g>
    <g>
      <text x="30" y="634" font-size="13" font-weight="900" fill="#0B1F3A" letter-spacing="2.5">DISTINGUISHING PERKS</text>
      <text x="30" y="656" font-size="14.5" fill="#333">Unlimited access to the Guidelines, a vote in Board and Council</text>
      <text x="30" y="675" font-size="14.5" fill="#333">elections, the Journal of the TEI, an annual conference, and a very</text>
      <text x="30" y="694" font-size="14.5" fill="#333">strong opinion on &lt;div&gt;.</text>
    </g>
  </g>

  <!-- footer banner -->
  <rect y="714" width="640" height="166" fill="#C8102E"/>
  <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" fill="#fff">
    <text x="30" y="762" font-size="27">REPORT FOR INDUCTION</text>
    <text x="30" y="800" font-size="27">IMMEDIATELY</text>
  </g>
  <text x="30" y="850" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#fff">SCAN TO AUTHENTICATE MEMBERSHIP &#9654;</text>
  <a href="https://members.tei-c.org/Join" xlink:href="https://members.tei-c.org/Join">
    <rect x="454" y="726" width="156" height="140" fill="#fff"/>
